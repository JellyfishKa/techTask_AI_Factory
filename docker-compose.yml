version: "3.8"

services:
  openclaw:
    build: .
    container_name: openclaw-gateway
    ports:
      - "18789:18789"
    env_file:
      - .env
    volumes:
      # Персистентное хранилище данных OpenClaw
      - openclaw-data:/home/node/.openclaw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "openclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openclaw-data:
    driver: local
